<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>ICEMAN dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #050506;
  color: #fafafa;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100svh;
  padding:
    max(32px, env(safe-area-inset-top))
    max(24px, env(safe-area-inset-right))
    max(32px, env(safe-area-inset-bottom))
    max(24px, env(safe-area-inset-left));
}

.lock-wordmark {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.20em;
  color: rgba(255,255,255,0.25);
  text-transform: uppercase;
  margin-bottom: 48px;
  user-select: none;
}

.lock-card {
  width: 100%;
  max-width: 340px;
}

.lock-heading {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
  text-align: center;
}
.lock-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.38);
  margin-bottom: 28px;
  text-align: center;
  line-height: 1.4;
}

.lock-input {
  display: block;
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 12px;
  color: #fafafa;
  font-family: inherit;
  font-size: 17px;
  padding: 14px 16px;
  outline: none;
  text-align: center;
  letter-spacing: 0.12em;
  margin-bottom: 10px;
  transition: border-color 0.15s;
  -webkit-text-security: disc;
  -webkit-appearance: none;
}
.lock-input:focus { border-color: rgba(255,255,255,0.24); }
.lock-input.shake {
  border-color: #ff6b6b;
  animation: lock-shake 0.32s ease;
}
@keyframes lock-shake {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-10px); }
  75%      { transform: translateX(10px); }
}

.lock-btn {
  display: block;
  width: 100%;
  background: #fafafa;
  color: #050506;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  padding: 14px;
  cursor: pointer;
  letter-spacing: 0.04em;
  margin-top: 4px;
  transition: opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.lock-btn:active { opacity: 0.75; }
.lock-btn:disabled { opacity: 0.45; cursor: default; }

.lock-err {
  min-height: 20px;
  margin-top: 12px;
  font-size: 13px;
  color: #ff6b6b;
  text-align: center;
}

/* Profile picker */
.profile-pick-label {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-align: center;
  margin-bottom: 6px;
}
.profile-pick-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.38);
  text-align: center;
  margin-bottom: 28px;
}
.profile-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 340px;
}
.profile-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 28px 16px 22px;
  text-align: center;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}
.profile-card:hover  { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.16); }
.profile-card:active { transform: scale(0.95); }
.profile-avatar {
  width: 54px; height: 54px;
  border-radius: 50%;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.10);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 800;
  letter-spacing: 0.04em;
  color: #fafafa;
  margin: 0 auto 14px;
}
.profile-name {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.70);
}

/* Screens */
.screen { display: none; flex-direction: column; align-items: center; width: 100%; }
.screen.active { display: flex; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supa.js"></script>
</head>
<body>

<div class="lock-wordmark">Welcome</div>

<!-- LOGIN -->
<div class="screen" id="sLogin">
  <form class="lock-card" id="loginForm" novalidate>
    <div class="lock-heading">Velkommen tilbake</div>
    <div class="lock-sub">Logg inn for å fortsette.</div>
    <input class="lock-input" type="email" id="loginEmail" placeholder="E-post" autocomplete="username" inputmode="email" required>
    <input class="lock-input" type="password" id="loginPw" placeholder="Passord" autocomplete="current-password" required style="margin-top:10px">
    <button class="lock-btn" id="loginBtn" type="submit">Logg inn</button>
    <div class="lock-err" id="loginErr" role="alert"></div>
  </form>
</div>

<!-- PROFILE PICKER -->
<div class="screen" id="sPick">
  <div class="profile-pick-label">Hvem er du?</div>
  <div class="profile-pick-sub">Velg profil.</div>
  <div class="profile-grid" id="profileGrid"></div>
</div>

<script>
'use strict';

const PROFILES = ['ICEMAN', 'BATMAN'];
const SESS_KEY = '_session';
const LEGACY_AUTH_KEY = '_auth';   // old browser-only password hash — no longer used

function getSess()    { try { return JSON.parse(localStorage.getItem(SESS_KEY)); } catch { return null; } }
function setSess(obj) { localStorage.setItem(SESS_KEY, JSON.stringify(obj)); }

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function shake(id) {
  const el = document.getElementById(id);
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 400);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  localStorage.removeItem(LEGACY_AUTH_KEY);
  const supa = window.getSupa && window.getSupa();
  if (!supa) {
    show('sLogin');
    document.getElementById('loginErr').textContent = 'Får ikke kontakt med innloggingen. Sjekk nettet og last siden på nytt.';
    return;
  }
  const user = await window.getSupaUser();
  if (!user) {
    setSess({});
    show('sLogin');
    document.getElementById('loginEmail').focus();
    return;
  }
  const sess = getSess();
  if (sess && sess.profile && PROFILES.includes(sess.profile)) {
    window.location.replace('index.html');
    return;
  }
  setSess({ authenticated: true });
  showPicker();
}

// ─── Login ────────────────────────────────────────────────────────────────────
document.getElementById('loginForm').addEventListener('submit', doLogin);

async function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pw    = document.getElementById('loginPw').value;
  const err   = document.getElementById('loginErr');
  const btn   = document.getElementById('loginBtn');
  err.textContent = '';
  if (!email || !pw) { err.textContent = 'Fyll inn e-post og passord.'; return; }

  const supa = window.getSupa && window.getSupa();
  if (!supa) { err.textContent = 'Får ikke kontakt med innloggingen. Sjekk nettet.'; return; }

  btn.textContent = 'Logger inn…'; btn.disabled = true;
  let result;
  try {
    result = await supa.auth.signInWithPassword({ email, password: pw });
  } catch (ex) {
    result = { error: { message: 'network' } };
  }
  btn.textContent = 'Logg inn'; btn.disabled = false;

  if (result.error) {
    err.textContent = result.error.message === 'network'
      ? 'Ingen nettforbindelse. Prøv igjen.'
      : 'Feil e-post eller passord.';
    shake('loginPw');
    document.getElementById('loginPw').value = '';
    document.getElementById('loginPw').focus();
    return;
  }
  setSess({ authenticated: true });
  showPicker();
}

// ─── Profile picker ───────────────────────────────────────────────────────────
function showPicker() {
  const grid = document.getElementById('profileGrid');
  grid.innerHTML = PROFILES.map(name => `
    <button class="profile-card" data-p="${name}" type="button">
      <div class="profile-avatar">${name.slice(0,2)}</div>
      <div class="profile-name">${name}</div>
    </button>
  `).join('');
  grid.querySelectorAll('.profile-card').forEach(card => {
    card.addEventListener('click', () => {
      setSess({ authenticated: true, profile: card.dataset.p });
      window.location.replace('index.html');
    });
  });
  show('sPick');
}

init();
</script>
</body>
</html>
