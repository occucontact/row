<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<title>Daily</title>
<script src="profile.js"></script>
<script src="locale.js"></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255,255,255,0.04);
  --bg-card-hover: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --accent: #C6F36D;
  --accent-dim: rgba(198,243,109,0.14);
  --accent-glow: rgba(198,243,109,0.35);
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger: #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text-secondary);
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(50% 40% at 80% 8%, rgba(198,243,109,0.09) 0%, transparent 60%),
    radial-gradient(45% 35% at 15% 90%, rgba(107,227,164,0.06) 0%, transparent 60%);
  filter: blur(40px);
}
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
}
main {
  max-width: 560px; margin: 0 auto;
  padding: 28px 16px calc(120px + env(safe-area-inset-bottom));
  position: relative; z-index: 1;
}

/* ---------- Header ---------- */
.dy-eyebrow {
  font: 800 10px/1 var(--font-mono); letter-spacing: 0.2em;
  color: var(--accent); text-transform: uppercase;
}
.dy-header h1 {
  font-size: 34px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text-primary); line-height: 1.05; margin-top: 8px;
}
.dy-header p { font-size: 13px; color: var(--text-tertiary); margin-top: 4px; }

/* ---------- Hero: clock + streak ---------- */
.dy-hero {
  margin-top: 22px;
  display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end;
  padding: 22px 20px 18px;
  border-radius: 20px;
  background:
    linear-gradient(160deg, rgba(198,243,109,0.07) 0%, rgba(255,255,255,0.02) 45%, rgba(255,255,255,0.03) 100%);
  border: 1px solid var(--border);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  position: relative; overflow: hidden;
}
.dy-hero.is-done { border-color: rgba(198,243,109,0.28); }
.dy-hero.pop { animation: dy-pop 0.7s var(--ease-out); }
@keyframes dy-pop { 0% { transform: scale(0.98); } 40% { transform: scale(1.015); } 100% { transform: scale(1); } }
.dy-clock-label, .dy-streak-label {
  font: 800 9.5px/1 var(--font-mono); letter-spacing: 0.18em;
  color: var(--text-tertiary); text-transform: uppercase;
}
.dy-clock {
  font: 700 52px/1 var(--font-mono); letter-spacing: -0.04em;
  color: var(--text-primary); font-variant-numeric: tabular-nums;
  margin-top: 10px;
}
.dy-hero.is-running .dy-clock { color: var(--accent); }
.dy-clock-state { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; min-height: 18px; }
.dy-streak { text-align: right; }
.dy-streak-num {
  display: flex; align-items: baseline; justify-content: flex-end; gap: 4px;
  font: 800 44px/1 var(--font-mono); color: var(--text-primary);
  margin-top: 10px; font-variant-numeric: tabular-nums;
}
.dy-streak-num small { font-size: 13px; color: var(--text-tertiary); font-weight: 700; }
.dy-flame { font-size: 26px; filter: grayscale(1) opacity(0.4); transition: filter 0.3s; }
.dy-hero.is-done .dy-flame { filter: drop-shadow(0 0 10px var(--accent-glow)); }
.dy-streak-risk { font-size: 11.5px; color: var(--warning); margin-top: 6px; min-height: 16px; }
.dy-progress {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 12px;
}
.dy-bar { flex: 1; height: 6px; border-radius: 6px; background: rgba(255,255,255,0.06); overflow: hidden; }
.dy-bar-fill {
  height: 100%; width: 100%; border-radius: 6px;
  background: linear-gradient(90deg, var(--success), var(--accent));
  transform-origin: left; transform: scaleX(0);
  transition: transform 0.5s var(--ease-out);
}
.dy-progress-count {
  font: 700 12px/1 var(--font-mono); color: var(--text-secondary);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.dy-actions { grid-column: 1 / -1; display: flex; gap: 8px; }

/* ---------- Buttons ---------- */
.dy-btn {
  flex: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 13px 14px; border-radius: 13px;
  font: 700 14px/1 var(--font); letter-spacing: 0.02em;
  cursor: pointer; border: 1px solid transparent;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.dy-btn:active { transform: scale(0.97); }
.dy-btn:focus-visible, .ex-check:focus-visible, .chip:focus-visible, .ex-go:focus-visible, .player button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.dy-btn-primary { background: var(--accent); color: #0B0D06; }
.dy-btn-primary:hover { background: #D4F88A; }
.dy-btn-ghost { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.08); color: var(--text-secondary); }
.dy-btn-ghost:hover { background: rgba(255,255,255,0.09); color: var(--text-primary); }
.dy-btn[hidden] { display: none; }

/* ---------- Stats ---------- */
.dy-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.dy-stat {
  padding: 12px 14px; border-radius: 14px;
  background: var(--bg-card); border: 1px solid var(--border);
}
.dy-stat-val {
  font: 700 18px/1.1 var(--font-mono); color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.dy-stat-label { font-size: 10.5px; color: var(--text-tertiary); margin-top: 4px; }

/* ---------- Section labels ---------- */
.dy-section { margin-top: 32px; }
.dy-section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.dy-section-label {
  font: 800 10px/1 var(--font-mono); letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-tertiary);
}
.dy-section-meta { font-size: 11.5px; color: var(--text-tertiary); }

/* ---------- Heatmap ---------- */
.dy-heat {
  display: grid; grid-auto-flow: column;
  grid-template-rows: repeat(7, 1fr);
  gap: 4px;
  padding: 14px; border-radius: 16px;
  background: var(--bg-card); border: 1px solid var(--border);
}
.dy-heat-cell {
  aspect-ratio: 1; border-radius: 4px;
  background: rgba(255,255,255,0.05);
}
.dy-heat-cell.partial { background: rgba(198,243,109,0.25); }
.dy-heat-cell.done { background: var(--accent); box-shadow: 0 0 8px rgba(198,243,109,0.25); }
.dy-heat-cell.today { outline: 1.5px solid var(--text-primary); outline-offset: 1px; }
.dy-heat-cell.future { background: transparent; }

/* ---------- Exercise list ---------- */
.ex-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.ex {
  display: grid; grid-template-columns: 40px 1fr; gap: 12px;
  padding: 16px 16px 16px 12px;
  border-radius: 16px;
  background: var(--bg-card); border: 1px solid var(--border);
  transition: background 0.2s, border-color 0.2s, opacity 0.3s;
}
.ex:hover { background: var(--bg-card-hover); }
.ex.is-checked { opacity: 0.55; border-color: rgba(198,243,109,0.16); }
.ex.is-checked:hover { opacity: 0.8; }
.ex.is-active { border-color: rgba(198,243,109,0.5); background: rgba(198,243,109,0.06); opacity: 1; }
.ex-check {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.18);
  background: transparent; color: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.12s;
}
.ex-check:hover { border-color: var(--accent); }
.ex-check:active { transform: scale(0.9); }
.ex-check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0B0D06; }
.ex-check svg { width: 16px; height: 16px; }
.ex-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ex-num { font: 700 11px/1 var(--font-mono); color: var(--text-tertiary); }
.ex h3 { font-size: 15.5px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; line-height: 1.3; }
.ex.is-checked h3 { text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.3); }
.ex-tag {
  font: 800 9px/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 6px; border-radius: 5px;
  background: rgba(255,255,255,0.06); color: var(--text-secondary);
}
.ex-tag.opt { background: rgba(242,192,99,0.14); color: var(--warning); }
.ex-dose {
  font: 600 12.5px/1.45 var(--font-mono); color: var(--accent);
  margin-top: 5px;
}
.ex-cue { font-size: 13px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }
.ex-why { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; display: flex; gap: 6px; }
.ex-why::before { content: '📌'; font-size: 11px; }
.ex-note {
  font-size: 12px; color: var(--warning); margin-top: 8px;
  padding: 7px 10px; border-radius: 9px; background: rgba(242,192,99,0.07);
}
.ex-week { font-size: 11.5px; color: var(--text-tertiary); margin-top: 6px; }
.ex-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.chip {
  font: 700 12px/1 var(--font-mono);
  padding: 8px 10px; border-radius: 9px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-secondary); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.chip:hover { background: rgba(255,255,255,0.08); }
.chip[aria-pressed="true"] { background: var(--accent-dim); border-color: rgba(198,243,109,0.45); color: var(--accent); }
.ex-tools { justify-content: flex-end; }
.ex-time { font: 600 11.5px/1 var(--font-mono); color: var(--text-tertiary); margin-right: auto; }
.ex-go {
  font: 700 12.5px/1 var(--font);
  padding: 9px 12px; border-radius: 10px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-primary); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.ex-go:hover { background: rgba(198,243,109,0.16); border-color: rgba(198,243,109,0.4); }
.ex-go:active { transform: scale(0.96); }
.ex-max { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.ex-max label { font-size: 11px; color: var(--text-tertiary); display: flex; flex-direction: column; gap: 5px; }
.ex-max input {
  width: 100%; padding: 10px 12px; border-radius: 10px;
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-primary); font: 700 18px/1 var(--font-mono);
}
.ex-max input:focus { outline: none; border-color: var(--accent); }
.ex-record { font-size: 11.5px; color: var(--text-tertiary); margin-top: 8px; font-family: var(--font-mono); }

/* ---------- Settings ---------- */
.dy-settings {
  margin-top: 28px; padding: 14px 16px; border-radius: 14px;
  background: var(--bg-card); border: 1px solid var(--border);
  font-size: 13px;
}
.dy-settings summary { cursor: pointer; color: var(--text-secondary); font-weight: 600; }
.dy-settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
.dy-settings input[type="date"] {
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-primary); padding: 8px 10px; border-radius: 9px;
  font: 600 13px var(--font-mono); color-scheme: dark;
}
.dy-link-danger {
  background: none; border: none; color: var(--danger); font: 600 13px var(--font); cursor: pointer;
}

/* ---------- Player (guided session) ---------- */
[hidden] { display: none !important; }
body.pl-lock { overflow: hidden; }
.player {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column;
  background:
    radial-gradient(60% 40% at 85% 0%, rgba(198,243,109,0.10) 0%, transparent 60%),
    radial-gradient(50% 35% at 10% 100%, rgba(107,227,164,0.06) 0%, transparent 60%),
    var(--bg);
  padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  overflow-y: auto; overscroll-behavior: contain;
  animation: pl-in 0.35s var(--ease-out);
}
@keyframes pl-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.pl-inner { width: 100%; max-width: 560px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
.player.is-summary .pl-work, .player:not(.is-summary) .pl-summary { display: none; }
.pl-top { display: flex; align-items: center; gap: 10px; }
.pl-icon-btn {
  flex-shrink: 0; width: 42px; height: 42px; border-radius: 12px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-primary); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; transition: background 0.15s, transform 0.1s;
}
.pl-icon-btn:hover { background: rgba(255,255,255,0.12); }
.pl-icon-btn:active { transform: scale(0.94); }
.pl-progress { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.pl-session { font: 700 13px/1 var(--font-mono); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.pl-pause {
  flex-shrink: 0; padding: 10px 12px; border-radius: 11px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-primary); font: 700 12.5px/1 var(--font); cursor: pointer;
}
.player.is-paused .pl-pause { background: var(--accent); color: #0B0D06; border-color: var(--accent); }
.pl-main { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 26px 0 12px; }
.pl-step { font: 800 10px/1 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
.pl-name {
  font-size: 30px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.12;
  color: var(--text-primary); margin-top: 10px; text-wrap: balance;
}
.pl-dose { font: 600 14px/1.45 var(--font-mono); color: var(--accent); margin-top: 8px; max-width: 440px; }
.pl-ring { position: relative; width: 220px; height: 220px; margin: 24px auto 8px; }
.pl-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.pl-ring circle { fill: none; stroke-width: 8; }
.pl-ring .track { stroke: rgba(255,255,255,0.07); }
.pl-ring .arc { stroke: var(--accent); stroke-linecap: round; transition: stroke 0.3s; }
.player[data-phase="gap"] .pl-ring .arc { stroke: #7DD3FC; }
.player[data-phase="idle"] .pl-ring .arc { stroke: rgba(255,255,255,0.12); }
.player[data-phase="done"] .pl-ring .arc { stroke: var(--success); }
.pl-big {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: 800 72px/1 var(--font-mono); letter-spacing: -0.04em;
  color: var(--text-primary); font-variant-numeric: tabular-nums;
}
.pl-big.is-long { font-size: 46px; }
.player[data-phase="done"] .pl-big { color: var(--success); }
.player.is-paused .pl-big { opacity: 0.4; }
.pl-label { font: 600 13px/1.4 var(--font-mono); color: var(--accent); min-height: 18px; }
.player[data-phase="gap"] .pl-label { color: #7DD3FC; }
.player[data-phase="idle"] .pl-label { color: var(--text-tertiary); }
.player[data-phase="done"] .pl-label { color: var(--success); }
.pl-chips { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
.pl-chips:empty { display: none; }
.chip:disabled { opacity: 0.4; cursor: default; }
.pl-timer-row { display: flex; justify-content: center; margin-top: 12px; }
.pl-timer-start {
  padding: 12px 16px; border-radius: 12px;
  background: var(--accent-dim); border: 1px solid rgba(198,243,109,0.4);
  color: var(--accent); font: 700 14px/1 var(--font); cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: background 0.15s, transform 0.1s;
}
.pl-timer-start:hover { background: rgba(198,243,109,0.24); }
.pl-timer-start:active { transform: scale(0.97); }
.pl-timer-ctl { display: flex; gap: 8px; }
.pl-timer-ctl .pl-icon-btn { width: 56px; height: 46px; }
.pl-info {
  width: 100%; text-align: left; margin-top: 22px;
  padding: 14px 16px; border-radius: 16px;
  background: var(--bg-card); border: 1px solid var(--border);
}
.pl-info:not(:has(p:not(:empty))):not(:has(#plMax:not([hidden]))) { display: none; }
.pl-info p:empty { display: none; }
.pl-info .ex-cue { margin-top: 0; font-size: 14px; }
.pl-actions {
  margin-top: auto; padding-top: 14px; display: flex; flex-direction: column; gap: 10px;
  /* Keep the confirm button reachable on short screens */
  position: sticky; bottom: 0;
  background: linear-gradient(180deg, transparent 0%, var(--bg) 22%);
}
.pl-confirm {
  width: 100%; padding: 19px; border-radius: 16px; border: none;
  background: var(--accent); color: #0B0D06;
  font: 800 16px/1 var(--font); letter-spacing: 0.01em; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: background 0.15s, transform 0.1s;
}
.pl-confirm:hover { background: #D4F88A; }
.pl-confirm:active { transform: scale(0.98); }
.pl-confirm.is-ready { animation: pl-ready 1.4s ease-in-out infinite; }
@keyframes pl-ready {
  0%, 100% { box-shadow: 0 0 0 0 rgba(198,243,109,0.5); }
  50% { box-shadow: 0 0 0 10px rgba(198,243,109,0); }
}
.pl-sub { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.pl-next { font-size: 12px; color: var(--text-tertiary); text-align: center; }
.pl-link {
  background: none; border: none; padding: 8px 4px; cursor: pointer;
  color: var(--text-secondary); font: 600 13px var(--font);
  white-space: nowrap;
}
.pl-link:disabled { opacity: 0.3; cursor: default; }
#plPrev { justify-self: start; }
#plSkip { justify-self: end; color: var(--warning); }
.pl-summary { justify-content: center; align-items: center; text-align: center; gap: 6px; }
.pl-sum-flame { font-size: 64px; filter: drop-shadow(0 0 24px var(--accent-glow)); }
.pl-sum-title { font-size: 30px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; }
.pl-sum-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin: 22px 0 26px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; top: calc(80px + env(safe-area-inset-top));
  transform: translate(-50%, -12px); opacity: 0;
  padding: 10px 16px; border-radius: 12px; z-index: 60;
  background: #1c1c1e; border: 1px solid rgba(255,255,255,0.12);
  color: var(--text-primary); font-size: 13px; font-weight: 600;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s var(--ease-out);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 480px) {
  .dy-clock { font-size: 42px; }
  .dy-streak-num { font-size: 36px; }
  .pl-name { font-size: 25px; }
  .pl-main { padding-top: 18px; }
  .pl-session { display: none; }
}
@media (max-height: 720px) {
  .pl-ring { width: 170px; height: 170px; margin-top: 16px; }
  .pl-big { font-size: 56px; }
  .pl-big.is-long { font-size: 36px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main>
  <header class="dy-header">
    <div class="dy-eyebrow">Daglig mobilitet</div>
    <h1>Daily</h1>
    <p id="dyDate"></p>
  </header>

  <section class="dy-hero" id="dyHero" aria-label="Dagens økt">
    <div>
      <div class="dy-clock-label">Øktid</div>
      <div class="dy-clock" id="dyClock" role="timer" aria-live="off">00:00</div>
      <div class="dy-clock-state" id="dyClockState"></div>
    </div>
    <div class="dy-streak">
      <div class="dy-streak-label">Streak</div>
      <div class="dy-streak-num"><span class="dy-flame" aria-hidden="true">🔥</span><span id="dyStreak">0</span><small>d</small></div>
      <div class="dy-streak-risk" id="dyStreakRisk"></div>
    </div>
    <div class="dy-progress">
      <div class="dy-bar"><div class="dy-bar-fill" id="dyBar"></div></div>
      <span class="dy-progress-count" id="dyCount">0/0</span>
    </div>
    <div class="dy-actions">
      <button class="dy-btn dy-btn-primary" id="dyStart" type="button">▶ Start økt</button>
      <button class="dy-btn dy-btn-ghost" id="dyPause" type="button" hidden>❚❚ Pause</button>
      <button class="dy-btn dy-btn-ghost" id="dyFinish" type="button" hidden>✓ Fullfør</button>
      <button class="dy-btn dy-btn-ghost" id="dyReopen" type="button" hidden>↺ Gjenåpne økta</button>
    </div>
  </section>

  <div class="dy-stats">
    <div class="dy-stat"><div class="dy-stat-val" id="dyBest">0</div><div class="dy-stat-label">Beste streak</div></div>
    <div class="dy-stat"><div class="dy-stat-val" id="dyTotal">0</div><div class="dy-stat-label">Økter totalt</div></div>
    <div class="dy-stat"><div class="dy-stat-val" id="dyAvg">—</div><div class="dy-stat-label">Snittid</div></div>
  </div>

  <section class="dy-section" aria-labelledby="dyHeatLabel">
    <div class="dy-section-head">
      <span class="dy-section-label" id="dyHeatLabel">Siste 12 uker</span>
      <span class="dy-section-meta">man → søn</span>
    </div>
    <div class="dy-heat" id="dyHeat"></div>
  </section>

  <section class="dy-section" aria-labelledby="dyProgLabel">
    <div class="dy-section-head">
      <span class="dy-section-label" id="dyProgLabel">Program</span>
      <span class="dy-section-meta" id="dyWeek"></span>
    </div>
    <ol class="ex-list" id="dyList"></ol>
  </section>

  <details class="dy-settings">
    <summary>Innstillinger</summary>
    <div class="dy-settings-row">
      <label for="dyStartDate">Programstart (styrer Copenhagen-ukene)</label>
      <input type="date" id="dyStartDate">
    </div>
    <div class="dy-settings-row">
      <span>Nullstill dagens økt</span>
      <button class="dy-link-danger" id="dyReset" type="button">Nullstill</button>
    </div>
  </details>
</main>

<div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="plName" hidden>
  <div class="pl-inner pl-work">
    <div class="pl-top">
      <button class="pl-icon-btn" id="plClose" type="button" aria-label="Lukk økt-modus">✕</button>
      <div class="pl-progress">
        <div class="dy-bar"><div class="dy-bar-fill" id="plBar"></div></div>
        <span class="dy-progress-count" id="plCount">0/0</span>
      </div>
      <span class="pl-session" id="plSession">00:00</span>
      <button class="pl-pause" id="plPause" type="button">❚❚ Pause</button>
    </div>

    <div class="pl-main">
      <div class="pl-step" id="plStep"></div>
      <h2 class="pl-name" id="plName"></h2>
      <p class="pl-dose" id="plDose"></p>
      <div class="pl-ring">
        <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="92"/><circle class="arc" id="plArc" cx="100" cy="100" r="92"/></svg>
        <div class="pl-big" id="plBig" role="timer">00:00</div>
      </div>
      <div class="pl-label" id="plLabel" aria-live="polite"></div>
      <div class="pl-chips" id="plChips" aria-label="Velg sekunder"></div>
      <div class="pl-timer-row">
        <button class="pl-timer-start" id="plTimerStart" type="button">▶ Start nedtelling</button>
        <div class="pl-timer-ctl" id="plTimerCtl" hidden>
          <button class="pl-icon-btn" id="plTimerToggle" type="button" aria-label="Pause eller fortsett nedtelling">❚❚</button>
          <button class="pl-icon-btn" id="plTimerSkip" type="button" aria-label="Hopp til neste runde">⏭</button>
          <button class="pl-icon-btn" id="plTimerStop" type="button" aria-label="Stopp nedtelling">■</button>
        </div>
      </div>
      <div class="pl-info">
        <p class="ex-cue" id="plCue"></p>
        <p class="ex-why" id="plWhy"></p>
        <p class="ex-note" id="plNote"></p>
        <div class="ex-max" id="plMax" hidden>
          <label>Push-ups<input type="number" inputmode="numeric" min="0" max="999" id="plPushups" placeholder="0"></label>
          <label>Dips<input type="number" inputmode="numeric" min="0" max="999" id="plDips" placeholder="0"></label>
        </div>
      </div>
    </div>

    <div class="pl-actions">
      <button class="pl-confirm" id="plConfirm" type="button">✓ Gjort – neste</button>
      <div class="pl-sub">
        <button class="pl-link" id="plPrev" type="button">‹ Forrige</button>
        <span class="pl-next" id="plNext"></span>
        <button class="pl-link" id="plSkip" type="button" hidden>Hopp over ›</button>
      </div>
    </div>
  </div>

  <div class="pl-inner pl-summary">
    <div class="pl-sum-flame" aria-hidden="true">🔥</div>
    <div class="pl-sum-title">Økt fullført</div>
    <div class="pl-sum-stats">
      <div class="dy-stat"><div class="dy-stat-val" id="plSumStreak">0</div><div class="dy-stat-label">Dager på rad</div></div>
      <div class="dy-stat"><div class="dy-stat-val" id="plSumTime">00:00</div><div class="dy-stat-label">Øktid</div></div>
      <div class="dy-stat"><div class="dy-stat-val" id="plSumCount">0/0</div><div class="dy-stat-label">Øvelser</div></div>
    </div>
    <button class="pl-confirm" id="plSumClose" type="button">Ferdig</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="daily.js"></script>
</body>
</html>
